<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>introdução ao css</title>

    <style>
        h2 {
            color: crimson;
        }
        .destaque {
            background-color: rgb(146, 255, 124);
            color: rgb(92, 5, 255);
        }
        #rodape{
            background-color:turquoise;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="color:rgb(224, 199, 85); background-color: rgb(50, 128, 196);">Portal de Viagens</h1>
        <p style="color:rgb(41, 41, 41); ">explore destinos incriveis</p>
    </header>
    <main>
        <h2>aplica o estilo em todas as ocorrencias da tag</h2>
        <p class="destaque">promoções da semana!</p>
    </main>

    <footer id="rodape">
        <h2>teste</h2>
    </footer>
</body>
</html>
