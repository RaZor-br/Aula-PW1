<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixa</title>

    <style>
        .card{
            padding: 32px;
            background-color: #ffe66d;
            margin: 24px;
            border: 4px dashed #ff5a36;
            font-size: 24px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>O Modelo de Caixa (Box Model)</h1>

    <div class="card">
        preenchimento interio(Padding)
    </div>
    <div class="card">
        espaço externo(Margin)
    </div>
    <div class="card">
        borda(Border)
    </div>
</body>
</html>
