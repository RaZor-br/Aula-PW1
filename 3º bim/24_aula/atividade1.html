<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>festival cultural</title>
    <link rel="stylesheet" href="atividade1.css">

    <style>
        .banner {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #264653, #2a9d8f);
            color: aliceblue;
            padding: 18px 24px;
            border: 5px solid #e9c46a;
            border-radius: 18px;
            min-height: 280px;
            font-size: 24px;
            text-align: center;
        }

        .banner a {
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            padding: 16px 18px;
            background-color: #f1faee;
            border-radius: 18px;
            color: #264683;
        }

        .banner a:hover {
            transform: scale(1.05);
            color: #3565be;
        }
    </style>
</head>

<body>
    <section class="banner">
        <div>
            <h2>Bem-vindos ao Festival Cultural</h2>
            <a href="#programacao">Ver programação</a>
        </div>
    </section>
</body>

</html>
